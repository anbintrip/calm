<body>
<canvas id="stage"></canvas>
<div id="veil"></div>
<header id="titlebar">
  <div>
    <div class="name">Calm Canvas</div>
    <div class="desc" id="sceneDesc">—</div>
  </div>
</header>
<div id="hint">按 1–6 切換場景 · H 隱藏介面 · M 開關聲音</div>
<nav id="dock" aria-label="場景切換"></nav>

<script>
"use strict";
/* =====================================================================
   Calm Canvas —— 照片 + 動態層
   每個場景 = 一張背景照片 + 緩慢推鏡 + 視差 + 粒子 / 光暈 / 呼吸區。
   聲音全部以 Web Audio 即時合成，沒有任何音檔，也就沒有授權問題。
   ===================================================================== */

/* ------------------------------ 小工具 ------------------------------ */
const TAU = Math.PI * 2;
const rand  = (a = 1, b = 0) => b + Math.random() * (a - b);
const randi = (a, b) => Math.floor(rand(a, b));
const pick  = arr => arr[(Math.random() * arr.length) | 0];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp  = (a, b, t) => a + (b - a) * t;
const easeInOutSine = t => -(Math.cos(Math.PI * t) - 1) / 2;

function hash(n) { const s = Math.sin(n * 12.9898) * 43758.5453123; return s - Math.floor(s); }
function noise1(x) {
  const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f);
  return lerp(hash(i), hash(i + 1), u);
}
function fbm1(x) {
  return noise1(x) * .5 + noise1(x * 2.03) * .25 + noise1(x * 4.01) * .125 + noise1(x * 8.7) * .0625;
}

/* --------------------------- Canvas 引擎 --------------------------- */
const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d', { alpha: false });
let W = 0, H = 0, DPR = 1;

function sizeCanvas() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width  = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  grainPattern = null;
}

function roundRect(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

// 徑向柔光：color 用 'rgba(255,200,120,$)'，$ 會被換成 alpha
function glow(x, y, r, color, a1, a2 = 0) {
  if (r <= 0) return;
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, color.replace('$', a1));
  g.addColorStop(1, color.replace('$', a2));
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
}

// 底片顆粒
let grainTex = null, grainPattern = null;
function makeGrain(size = 200) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  const x = c.getContext('2d');
  const img = x.createImageData(size, size), d = img.data;
  for (let i = 0; i < size * size; i++) {
    const v = 128 + (Math.random() - .5) * 46;
    d[i * 4] = d[i * 4 + 1] = d[i * 4 + 2] = v; d[i * 4 + 3] = 255;
  }
  x.putImageData(img, 0, 0);
  return c;
}
function grain(alpha) {
  if (alpha <= 0) return;
  if (!grainTex) grainTex = makeGrain();
  if (!grainPattern) grainPattern = ctx.createPattern(grainTex, 'repeat');
  ctx.save();
  ctx.globalCompositeOperation = 'overlay';
  ctx.globalAlpha = alpha;
  ctx.fillStyle = grainPattern;
  ctx.fillRect(0, 0, W, H);
  ctx.restore();
}

/* --------------------------- 音訊引擎 ------------------------------
   所有聲音都是即時合成：白噪音過濾波器做雨、隨機脈衝做火花、
   低頻正弦做海底。沒有使用任何錄音檔，因此不涉及任何音訊授權。
   預設音量偏小，使用者可用 dock 上的滑桿調整。
   ------------------------------------------------------------------ */
const Audio_ = {
  ctx: null, master: null, noiseBuf: null, on: false, vol: .28,
  nodes: [], timers: [], bus: null,

  ensure() {
    if (this.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    this.ctx = new AC();
    this.master = this.ctx.createGain();
    this.master.gain.value = 0;
    this.master.connect(this.ctx.destination);
    const len = this.ctx.sampleRate * 2;
    const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    this.noiseBuf = buf;
  },

  noise(loop = true) {
    const s = this.ctx.createBufferSource();
    s.buffer = this.noiseBuf; s.loop = loop; return s;
  },
  track(n) { this.nodes.push(n); return n; },
  every(ms, fn) { const id = setInterval(fn, ms); this.timers.push(id); return id; },
  after(ms, fn) { const id = setTimeout(fn, ms); this.timers.push(id); return id; },

  // 常用音色：帶通/低通噪音層
  bed(bus, { type = 'lowpass', freq = 400, q = 1, gain = .1, lfo = 0, lfoAmt = 0 }) {
    const c = this.ctx;
    const n = this.track(this.noise());
    const f = c.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
    const g = c.createGain(); g.gain.value = gain;
    if (lfo) {
      const o = this.track(c.createOscillator()); o.type = 'sine'; o.frequency.value = lfo;
      const a = c.createGain(); a.gain.value = lfoAmt;
      o.connect(a); a.connect(g.gain); o.start();
    }
    n.connect(f); f.connect(g); g.connect(bus); n.start();
    return g;
  },
  // 柔和的持續音（和聲鋪底）
  pad(bus, freqs, gain = .02, type = 'sine') {
    const c = this.ctx;
    freqs.forEach((fq, i) => {
      const o = this.track(c.createOscillator()); o.type = type; o.frequency.value = fq;
      const det = this.track(c.createOscillator()); det.type = 'sine'; det.frequency.value = .06 + i * .03;
      const da = c.createGain(); da.gain.value = .55; det.connect(da); da.connect(o.frequency); det.start();
      const g = c.createGain(); g.gain.value = Math.max(.004, gain - i * .004);
      o.connect(g); g.connect(bus); o.start();
    });
  },
  // 一次性的短音（滴答、鈴、氣泡）
  ping(bus, { freq = 880, type = 'sine', gain = .04, dur = .8, slideTo = 0, attack = .01 }) {
    const c = this.ctx, now = c.currentTime;
    const o = c.createOscillator(); o.type = type;
    o.frequency.setValueAtTime(freq, now);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), now + dur * .3);
    const g = c.createGain();
    g.gain.setValueAtTime(0, now);
    g.gain.linearRampToValueAtTime(gain, now + attack);
    g.gain.exponentialRampToValueAtTime(.0001, now + dur);
    o.connect(g); g.connect(bus); o.start(now); o.stop(now + dur + .05);
  },
  // 短促的噪音爆裂（劈啪、蟲鳴）
  burst(bus, { freq = 2000, q = 8, gain = .1, dur = .12, rate = 1 }) {
    const c = this.ctx, now = c.currentTime;
    const s = c.createBufferSource(); s.buffer = this.noiseBuf; s.playbackRate.value = rate;
    const f = c.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q;
    const g = c.createGain();
    g.gain.setValueAtTime(0, now);
    g.gain.linearRampToValueAtTime(gain, now + .005);
    g.gain.exponentialRampToValueAtTime(.0001, now + dur);
    s.connect(f); f.connect(g); g.connect(bus); s.start(now); s.stop(now + dur + .05);
  },

  stopScene() {
    for (const id of this.timers) { clearInterval(id); clearTimeout(id); }
    this.timers.length = 0;
    for (const n of this.nodes) { try { n.stop ? n.stop() : n.disconnect(); } catch (e) {} }
    this.nodes.length = 0;
    if (this.bus) { try { this.bus.disconnect(); } catch (e) {} this.bus = null; }
  },
  startScene(scene) {
    if (!this.ctx || !scene || !scene.audio) return;
    this.bus = this.ctx.createGain();
    this.bus.gain.value = 1;
    this.bus.connect(this.master);
    try { scene.audio(this, this.bus); } catch (e) { console.warn('audio', e); }
  },
  fade(to, secs = 1.2) {
    if (!this.ctx) return;
    const g = this.master.gain, t = this.ctx.currentTime;
    g.cancelScheduledValues(t);
    g.setValueAtTime(Math.max(.0001, g.value), t);
    g.linearRampToValueAtTime(Math.max(.0001, to), t + secs);
  },
  setVolume(v) {
    this.vol = clamp(v, 0, 1);
    try { localStorage.setItem('calm.vol', String(this.vol)); } catch (e) {}
    if (this.on) this.fade(this.vol, .15);
  },
  toggle() {
    this.ensure();
    if (!this.ctx) return false;
    if (this.ctx.state === 'suspended') this.ctx.resume();
    this.on = !this.on;
    if (this.on) { this.stopScene(); this.startScene(current); this.fade(this.vol, 1.6); }
    else { this.fade(0, .7); setTimeout(() => { if (!this.on) this.stopScene(); }, 800); }
    return this.on;
  },
  switchTo(scene) {
    if (!this.on || !this.ctx) return;
    this.fade(0, .35);
    setTimeout(() => {
      if (!this.on) return;
      this.stopScene(); this.startScene(scene); this.fade(this.vol, 1.0);
    }, 380);
  }
};

/* =====================================================================
   動態引擎
   一個場景 = 一張照片 + 下面這些可疊加的動態層：
     kb        緩慢推鏡（Ken Burns）
     parallax  滑鼠 / 手機傾斜的視差
     breathe   指定區域的「呼吸」（主體輕微脹縮，例如趴著的貓）
     hotspots  局部光暈呼吸 / 火光閃動
     beams     光束
     layers    粒子（雨、灰塵、火星、氣泡、螢火、閃爍、熱氣…）
     grade     色調與暗角
   座標一律用「圖片內的相對座標」0~1，這樣推鏡與視差時會跟著圖片一起移動。
   ===================================================================== */

/* ---------------------------- 圖片載入 ---------------------------- */
function loadScene(sc) {
  if (sc._state) return;
  sc._state = 'loading';
  const src = (isPortrait() && sc.imgPortrait) ? sc.imgPortrait : sc.img;
  if (!src) { sc._state = 'missing'; return; }
  const im = new Image();
  im.decoding = 'async';
  im.onload = () => { sc._img = im; sc._state = 'ok'; sc._fade = 0; sc._sprites = null; };
  im.onerror = () => { sc._state = 'missing'; };
  im.src = src;
}
const isPortrait = () => window.innerHeight > window.innerWidth * 1.15;

/* ------------------------- 背景（推鏡 + 視差） ------------------------- */
const pointer = { x: .5, y: .5, tx: .5, ty: .5 };

function drawBackdrop(sc, t, dt) {
  const im = sc._img;
  if (!im) { drawPlaceholder(sc, t); return null; }

  const iw = im.naturalWidth, ih = im.naturalHeight;
  const base = Math.max(W / iw, H / ih);      // 一律填滿畫面
  // 直式螢幕（手機）放不下整張橫圖，改成左右緩慢掃視，讓整張圖輪流被看見
  const tall = (W / H) < (iw / ih) * .80;

  const kb = sc.kb || {};
  const dur = (tall ? (kb.durP || 74) : (kb.dur || 46));
  const tri = Math.abs(((t / dur) % 2) - 1);          // 0→1→0 來回
  const p = easeInOutSine(tri);

  let zoom, cu, cv;
  if (tall) {
    const span = kb.spanP == null ? .30 : kb.spanP;
    const mid  = kb.midP == null ? .50 : kb.midP;
    zoom = lerp(1.0, 1.045, p);
    cu = lerp(mid - span, mid + span, p);
    cv = lerp(kb.from ? kb.from[1] : .5, kb.to ? kb.to[1] : .5, p);
  } else {
    zoom = lerp(kb.zoom ? kb.zoom[0] : 1.04, kb.zoom ? kb.zoom[1] : 1.11, p);
    cu = lerp(kb.from ? kb.from[0] : .5, kb.to ? kb.to[0] : .5, p);
    cv = lerp(kb.from ? kb.from[1] : .5, kb.to ? kb.to[1] : .5, p);
  }

  let sw = iw * base * zoom, sh = ih * base * zoom;
  let sx = W / 2 - cu * sw, sy = H / 2 - cv * sh;

  // 視差
  const amt = (sc.parallax == null ? .012 : sc.parallax) * Math.min(W, H);
  pointer.x += (pointer.tx - pointer.x) * Math.min(1, dt * 3.2);
  pointer.y += (pointer.ty - pointer.y) * Math.min(1, dt * 3.2);
  sx += (pointer.x - .5) * -2 * amt;
  sy += (pointer.y - .5) * -2 * amt * .6;

  // 不要露出邊
  sx = clamp(sx, W - sw, 0);
  sy = clamp(sy, H - sh, 0);

  ctx.drawImage(im, sx, sy, sw, sh);

  // 淡入
  if (sc._fade < 1) {
    sc._fade = Math.min(1, sc._fade + dt * 1.6);
    ctx.save();
    ctx.globalAlpha = 1 - sc._fade;
    ctx.fillStyle = '#0d0f13'; ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }
  return { sx, sy, sw, sh };
}

function drawPlaceholder(sc, t) {
  const g = ctx.createLinearGradient(0, 0, W, H);
  const c = sc.ph || ['#1d2430', '#2b3444'];
  g.addColorStop(0, c[0]); g.addColorStop(1, c[1]);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  glow(W * .5 + Math.sin(t * .3) * W * .06, H * .42, Math.min(W, H) * .55,
       'rgba(120,160,210,$)', .16);
  ctx.restore();

  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(255,255,255,.30)';
  ctx.font = `600 ${Math.round(Math.min(W, H) * .055)}px system-ui, sans-serif`;
  ctx.fillText(sc.icon + '  ' + sc.label, W / 2, H * .45);
  ctx.fillStyle = 'rgba(255,255,255,.55)';
  ctx.font = `600 ${Math.max(13, Math.round(Math.min(W, H) * .026))}px ui-monospace, Menlo, monospace`;
  ctx.fillText(sc.img, W / 2, H * .52);
  ctx.fillStyle = 'rgba(255,255,255,.34)';
  ctx.font = `400 ${Math.max(12, Math.round(Math.min(W, H) * .020))}px system-ui, sans-serif`;
  ctx.fillText('把這張圖放進 images 資料夾就會自動出現', W / 2, H * .575);
  ctx.textAlign = 'left';
}

/* --------------------------- 主體呼吸區 --------------------------- */
/* 把圖片裡指定的一塊（例如趴著的貓）剪下來、邊緣羽化，
   然後每幀以極小的幅度脹縮並上下浮動，看起來就像在呼吸。 */
function buildBreatheSprite(sc) {
  const b = sc.breathe, im = sc._img;
  if (!b || !im) return null;
  const iw = im.naturalWidth, ih = im.naturalHeight;
  const rx = Math.round(b.u * iw), ry = Math.round(b.v * ih);
  const rw = Math.max(2, Math.round(b.w * iw)), rh = Math.max(2, Math.round(b.h * ih));
  const c = document.createElement('canvas');
  c.width = rw; c.height = rh;
  const x = c.getContext('2d');
  x.drawImage(im, rx, ry, rw, rh, 0, 0, rw, rh);
  // 羽化邊緣，接縫才看不出來
  x.globalCompositeOperation = 'destination-in';
  const g = x.createRadialGradient(rw / 2, rh / 2, 0, rw / 2, rh / 2, Math.max(rw, rh) / 2);
  const soft = b.feather == null ? .55 : b.feather;
  g.addColorStop(0, 'rgba(0,0,0,1)');
  g.addColorStop(clamp(soft, .05, .95), 'rgba(0,0,0,1)');
  g.addColorStop(1, 'rgba(0,0,0,0)');
  x.fillStyle = g;
  x.save(); x.translate(rw / 2, rh / 2); x.scale(1, rh / rw || 1);
  x.beginPath(); x.arc(0, 0, rw / 2, 0, TAU); x.fill(); x.restore();
  return c;
}

function drawBreathe(sc, T, t) {
  const b = sc.breathe;
  if (!b || !T) return;
  if (!sc._breathe) sc._breathe = buildBreatheSprite(sc);
  const sp = sc._breathe;
  if (!sp) return;
  const rx = T.sx + b.u * T.sw, ry = T.sy + b.v * T.sh;
  const rw = b.w * T.sw, rh = b.h * T.sh;
  const ph = Math.sin(t * (b.speed || .55) * TAU * .18 + (b.phase || 0));
  const amp = b.amp == null ? .008 : b.amp;
  const s = 1 + amp * (ph * .5 + .5);
  const dy = (b.lift == null ? amp * .5 : b.lift) * rh * ph;
  ctx.drawImage(sp, rx - rw * (s - 1) / 2, ry - rh * (s - 1) / 2 + dy, rw * s, rh * s);
}

/* ---------------------------- 光暈熱點 ---------------------------- */
function drawHotspots(sc, T, t) {
  if (!sc.hotspots || !sc.hotspots.length) return;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const h of sc.hotspots) {
    const x = T ? T.sx + h.u * T.sw : W * h.u;
    const y = T ? T.sy + h.v * T.sh : H * h.v;
    const r = (T ? T.sw : W) * h.r;
    let a = h.a;
    if (h.flicker) a *= .62 + fbm1(t * (h.flicker === true ? 2.2 : h.flicker) + (h.seed || 0)) * .75;
    else a *= .78 + .32 * Math.sin(t * (h.speed || .6) + (h.seed || 0));
    glow(x, y, r, `rgba(${h.c},$)`, Math.max(0, a));
  }
  ctx.restore();
}

/* ----------------------------- 光束 -----------------------------
   用「拉長的徑向漸層」而不是硬邊多邊形，邊緣才不會出現直線。 */
function drawBeams(sc, T, t) {
  if (!sc.beams || !sc.beams.length) return;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < sc.beams.length; i++) {
    const b = sc.beams[i];
    const x = T ? T.sx + b.u * T.sw : W * b.u;
    const y = T ? T.sy + b.v * T.sh : H * b.v;
    const len = Math.max(W, H) * (b.len || 1.2);
    const half = (T ? T.sw : W) * (b.w || .05) * .5;
    const ang = (b.a || 1.15) + Math.sin(t * .11 + i) * .015;
    const alpha = (b.o || .07) * (.72 + .28 * Math.sin(t * .34 + i * 1.7));
    ctx.save();
    ctx.translate(x + Math.cos(ang) * len * .42, y + Math.sin(ang) * len * .42);
    ctx.rotate(ang);
    ctx.scale(len * .55, Math.max(2, half * 2.4));
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, 1);
    g.addColorStop(0, `rgba(${b.c || '255,235,190'},${alpha})`);
    g.addColorStop(.45, `rgba(${b.c || '255,235,190'},${alpha * .45})`);
    g.addColorStop(1, `rgba(${b.c || '255,235,190'},0)`);
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, 1, 0, TAU); ctx.fill();
    ctx.restore();
  }
  ctx.restore();
}

/* ----------------------------- 粒子 ----------------------------- */
function areaRect(a, T) {
  if (!a) return { x: -40, y: -40, w: W + 80, h: H + 80 };
  if (T) return { x: T.sx + a[0] * T.sw, y: T.sy + a[1] * T.sh,
                  w: (a[2] - a[0]) * T.sw, h: (a[3] - a[1]) * T.sh };
  return { x: a[0] * W, y: a[1] * H, w: (a[2] - a[0]) * W, h: (a[3] - a[1]) * H };
}

function initLayer(L) {
  const n = Math.round((L.n || 40) * (W * H < 500000 ? .65 : 1));
  L._p = Array.from({ length: n }, () => ({ init: false }));
  L._acc = 0;
}

function drawLayer(L, T, t, dt) {
  if (!L._p) initLayer(L);
  const R = areaRect(L.area, T);
  const P = L._p;
  const spd = L.speed || 1;

  switch (L.type) {

    case 'rain': case 'drizzle': {
      const fine = L.type === 'drizzle';
      const wind = L.wind == null ? .2 : L.wind;
      ctx.lineCap = 'butt';
      for (const d of P) {
        if (!d.init) {
          d.init = true; d.z = rand(1, .3);
          d.x = R.x + rand(R.w); d.y = R.y + rand(R.h);
          d.v = (fine ? 380 : 620) * spd * (d.z * .7 + .4);
          d.len = (fine ? 6 : 12) + d.z * (fine ? 10 : 20);
        }
        d.y += d.v * dt; d.x += d.v * wind * dt;
        if (d.y > R.y + R.h) { d.y = R.y - 20; d.x = R.x + rand(R.w); }
        if (d.x > R.x + R.w) d.x = R.x;
        ctx.strokeStyle = `rgba(${L.c || '226,240,252'},${(L.o || .3) * (.35 + d.z * .65)})`;
        ctx.lineWidth = (fine ? .5 : .7) + d.z * (fine ? .7 : 1.1);
        ctx.beginPath();
        ctx.moveTo(d.x, d.y); ctx.lineTo(d.x - d.len * wind, d.y - d.len);
        ctx.stroke();
      }
      break;
    }

    case 'snow': {
      for (const d of P) {
        if (!d.init) {
          d.init = true; d.z = rand(1, .3);
          d.x = R.x + rand(R.w); d.y = R.y + rand(R.h);
          d.r = .8 + d.z * 2.4; d.p = rand(TAU); d.v = (26 + d.z * 44) * spd;
        }
        d.y += d.v * dt; d.x += Math.sin(t * .7 + d.p) * 16 * dt;
        if (d.y > R.y + R.h) { d.y = R.y - 10; d.x = R.x + rand(R.w); }
        ctx.fillStyle = `rgba(255,255,255,${(L.o || .55) * d.z})`;
        ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, TAU); ctx.fill();
      }
      break;
    }

    case 'dust': {          // 光裡的塵埃，緩緩上升
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      for (const d of P) {
        if (!d.init) {
          d.init = true; d.x = R.x + rand(R.w); d.y = R.y + rand(R.h);
          d.r = rand(2.2, .5); d.v = rand(12, 3) * spd; d.p = rand(TAU); d.a = rand(.8, .25);
        }
        d.y -= d.v * dt; d.x += Math.sin(t * .5 + d.p) * 9 * dt;
        if (d.y < R.y - 8) { d.y = R.y + R.h + 8; d.x = R.x + rand(R.w); }
        const a = d.a * (L.o || .5) * (.35 + .65 * Math.sin(t * 1.4 + d.p));
        ctx.fillStyle = `rgba(${L.c || '255,228,178'},${Math.max(0, a)})`;
        ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, TAU); ctx.fill();
      }
      ctx.restore();
      break;
    }

    case 'ember': {         // 火星
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      for (const d of P) {
        if (!d.init || d.life >= 1) {
          d.init = true; d.life = rand(.9, 0);
          d.x = R.x + rand(R.w); d.y = R.y + R.h;
          d.vx = rand(24, -24); d.vy = -rand(120, 45) * spd;
          d.dur = rand(3.4, 1.4); d.r = rand(1.7, .6);
        }
        d.life += dt / d.dur;
        d.x += (d.vx + Math.sin(t * 2.1 + d.y * .03) * 22) * dt;
        d.y += d.vy * dt; d.vy *= (1 - dt * .3);
        const a = Math.sin(clamp(d.life, 0, 1) * Math.PI) * (L.o || .85);
        glow(d.x, d.y, d.r * 7, `rgba(${L.c || '255,186,96'},$)`, a * .55);
        ctx.fillStyle = `rgba(255,232,186,${a})`;
        ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, TAU); ctx.fill();
      }
      ctx.restore();
      break;
    }

    case 'bubble': {
      for (const d of P) {
        if (!d.init) {
          d.init = true; d.x = R.x + rand(R.w); d.y = R.y + rand(R.h);
          d.r = rand(6, 1.4); d.v = rand(46, 14) * spd; d.p = rand(TAU);
        }
        d.y -= d.v * dt; d.x += Math.sin(t * 1.4 + d.p) * 12 * dt;
        if (d.y < R.y - 12) { d.y = R.y + R.h + rand(40, 4); d.x = R.x + rand(R.w); }
        const o = L.o || .5;
        ctx.strokeStyle = `rgba(240,255,255,${o})`; ctx.lineWidth = 1.1;
        ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, TAU); ctx.stroke();
        ctx.fillStyle = `rgba(226,250,255,${o * .28})`;
        ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, TAU); ctx.fill();
        ctx.fillStyle = `rgba(255,255,255,${o * 1.2})`;
        ctx.beginPath(); ctx.arc(d.x - d.r * .32, d.y - d.r * .34, Math.max(.4, d.r * .24), 0, TAU); ctx.fill();
      }
      break;
    }

    case 'firefly': {
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      for (const d of P) {
        if (!d.init) {
          d.init = true; d.x = R.x + rand(R.w); d.y = R.y + rand(R.h);
          d.p = rand(TAU); d.sp = rand(1.6, .5); d.r = rand(2.4, 1.1);
        }
        d.x += Math.sin(t * d.sp + d.p) * 16 * dt;
        d.y += Math.cos(t * d.sp * .8 + d.p * 1.7) * 11 * dt;
        const bl = Math.max(0, Math.sin(t * 1.8 + d.p));
        glow(d.x, d.y, d.r * 9, `rgba(${L.c || '214,255,168'},$)`, (L.o || .5) * bl);
        ctx.fillStyle = `rgba(244,255,214,${.85 * bl})`;
        ctx.beginPath(); ctx.arc(d.x, d.y, d.r * .55, 0, TAU); ctx.fill();
      }
      ctx.restore();
      break;
    }

    case 'sparkle': {       // 閃爍的星點 / 遠處燈火
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      for (const d of P) {
        if (!d.init) {
          d.init = true; d.x = R.x + rand(R.w); d.y = R.y + rand(R.h);
          d.p = rand(TAU); d.sp = rand(2.2, .4); d.r = rand(2.6, .8);
        }
        const a = (L.o || .5) * (.25 + .75 * (Math.sin(t * d.sp + d.p) * .5 + .5));
        glow(d.x, d.y, d.r * 5, `rgba(${L.c || '255,224,170'},$)`, a * .8);
        ctx.fillStyle = `rgba(255,250,235,${a})`;
        ctx.beginPath(); ctx.arc(d.x, d.y, d.r * .5, 0, TAU); ctx.fill();
        if (L.cross && a > (L.o || .5) * .8) {
          ctx.strokeStyle = `rgba(255,250,235,${(a - (L.o || .5) * .8) * 2})`;
          ctx.lineWidth = .9;
          const Ln = d.r * 5;
          ctx.beginPath();
          ctx.moveTo(d.x - Ln, d.y); ctx.lineTo(d.x + Ln, d.y);
          ctx.moveTo(d.x, d.y - Ln); ctx.lineTo(d.x, d.y + Ln);
          ctx.stroke();
        }
      }
      ctx.restore();
      break;
    }

    case 'steam': {         // 從一個點升起的熱氣
      const ox = T ? T.sx + (L.u || .5) * T.sw : W * (L.u || .5);
      const oy = T ? T.sy + (L.v || .5) * T.sh : H * (L.v || .5);
      const sc2 = (T ? T.sw : W) * (L.size || .05);
      ctx.save();
      ctx.globalCompositeOperation = 'lighter'; ctx.lineCap = 'round';
      const strands = L.n || 4;
      for (let i = 0; i < strands; i++) {
        const ph = t * (L.speed || .8) + i * 1.7;
        ctx.beginPath();
        for (let k = 0; k <= 12; k++) {
          const kk = k / 12;
          const x = ox + (i - (strands - 1) / 2) * sc2 * .22
                  + Math.sin(ph + kk * 3.2) * sc2 * (.18 + kk * .55)
                  + fbm1(ph * 1.5 + k * .5) * sc2 * .18;
          const y = oy - kk * sc2 * 2.6;
          k ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
        }
        const g = ctx.createLinearGradient(ox, oy, ox, oy - sc2 * 2.6);
        g.addColorStop(0, `rgba(${L.c || '255,246,230'},${(L.o || .22)})`);
        g.addColorStop(.45, `rgba(${L.c || '255,246,230'},${(L.o || .22) * .5})`);
        g.addColorStop(1, `rgba(${L.c || '255,246,230'},0)`);
        ctx.strokeStyle = g; ctx.lineWidth = sc2 * (.16 - i * .012);
        ctx.stroke();
      }
      ctx.restore();
      break;
    }

    case 'mist': {          // 飄過的薄霧
      ctx.save();
      ctx.beginPath(); ctx.rect(R.x, R.y, R.w, R.h); ctx.clip();
      ctx.globalCompositeOperation = L.dark ? 'source-over' : 'lighter';
      for (let i = 0; i < (L.n || 4); i++) {
        const w2 = R.w * (.5 + hash(i * 3.1) * .5);
        const x = R.x + ((t * (6 + i * 4) * spd + i * 611) % (R.w + w2)) - w2;
        const y = R.y + R.h * (.2 + hash(i * 5.7) * .6);
        const g = ctx.createRadialGradient(x + w2 / 2, y, 0, x + w2 / 2, y, w2 * .6);
        g.addColorStop(0, `rgba(${L.c || '236,242,248'},${(L.o || .12)})`);
        g.addColorStop(1, `rgba(${L.c || '236,242,248'},0)`);
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.ellipse(x + w2 / 2, y, w2 * .6, R.h * (.10 + hash(i * 2.3) * .08), 0, 0, TAU);
        ctx.fill();
      }
      ctx.restore();
      break;
    }

    case 'meteor': {        // 偶爾劃過的流星
      if (!L._m) L._m = [];
      if (Math.random() < dt * (L.rate || .6)) {
        const fromRight = Math.random() < .7;
        L._m.push({
          x: R.x + (fromRight ? rand(R.w * 1.1, R.w * .35) : rand(R.w * .5, -R.w * .1)),
          y: R.y + rand(R.h * .5, -R.h * .1),
          a: (fromRight ? Math.PI * .78 : Math.PI * .22) + rand(.14, -.14),
          v: rand(1400, 600), len: rand(260, 110), life: 0, dur: rand(1.5, .7), w: rand(2.4, 1)
        });
      }
      ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.lineCap = 'round';
      for (let i = L._m.length - 1; i >= 0; i--) {
        const m = L._m[i];
        m.life += dt / m.dur;
        if (m.life >= 1) { L._m.splice(i, 1); continue; }
        m.x += Math.cos(m.a) * m.v * dt; m.y += Math.sin(m.a) * m.v * dt;
        const a = Math.sin(m.life * Math.PI) * (L.o || 1);
        const tx = m.x - Math.cos(m.a) * m.len, ty = m.y - Math.sin(m.a) * m.len;
        const g = ctx.createLinearGradient(m.x, m.y, tx, ty);
        g.addColorStop(0, `rgba(255,255,255,${a})`);
        g.addColorStop(.22, `rgba(200,226,255,${a * .5})`);
        g.addColorStop(1, 'rgba(150,186,255,0)');
        ctx.strokeStyle = g; ctx.lineWidth = m.w;
        ctx.beginPath(); ctx.moveTo(m.x, m.y); ctx.lineTo(tx, ty); ctx.stroke();
        glow(m.x, m.y, 16, 'rgba(255,255,255,$)', a * .9);
      }
      ctx.restore();
      break;
    }

    case 'ripple': {        // 水面上的漣漪
      if (!L._r) L._r = [];
      L._acc += dt * (L.rate || 6);
      while (L._acc > 1) {
        L._acc -= 1;
        L._r.push({ x: R.x + rand(R.w), y: R.y + rand(R.h), life: 0 });
      }
      for (let i = L._r.length - 1; i >= 0; i--) {
        const r = L._r[i]; r.life += dt / (L.dur || 1.6);
        if (r.life >= 1) { L._r.splice(i, 1); continue; }
        ctx.strokeStyle = `rgba(${L.c || '255,255,255'},${(1 - r.life) * (L.o || .22)})`;
        ctx.lineWidth = 1.2;
        const rr = r.life * (L.size || 34);
        ctx.beginPath(); ctx.ellipse(r.x, r.y, rr, rr * (L.flat || .3), 0, 0, TAU); ctx.stroke();
      }
      break;
    }

    case 'water': {         // 水面波動：把該區域一條一條重畫並左右位移
      const im = sceneImg;
      if (!im || !T) break;
      const a = L.area || [0, .7, 1, 1];
      const iw = im.naturalWidth, ih = im.naturalHeight;
      const bands = L.bands || 34;
      const amp = (L.amp || .004) * T.sw;
      const sp = L.speed || 1.1;
      const sxi = a[0] * iw, swi = (a[2] - a[0]) * iw;
      const dxi = T.sx + a[0] * T.sw, dwi = (a[2] - a[0]) * T.sw;
      const vh = (a[3] - a[1]) / bands;
      ctx.save();
      ctx.beginPath();
      ctx.rect(dxi, T.sy + a[1] * T.sh, dwi, (a[3] - a[1]) * T.sh);
      ctx.clip();
      for (let i = 0; i < bands; i++) {
        const k = i / (bands - 1);
        const v0 = a[1] + i * vh;
        const taper = clamp(Math.min(k, 1 - k) / .14, 0, 1);
        const off = Math.sin(t * sp + k * (L.freq || 7) + (L.phase || 0)) * amp * taper * (L.grow === false ? 1 : (.35 + k));
        ctx.drawImage(im,
          sxi, v0 * ih, swi, vh * ih + 1,
          dxi + off, T.sy + v0 * T.sh, dwi, vh * T.sh + 1.5);
      }
      ctx.restore();
      break;
    }

    case 'leaf': {          // 緩緩飄落的葉子
      for (const d of P) {
        if (!d.init) {
          d.init = true; d.x = R.x + rand(R.w); d.y = R.y + rand(R.h);
          d.r = rand(7, 3); d.v = rand(26, 9) * spd; d.p = rand(TAU); d.rot = rand(TAU);
          d.sw = rand(1.4, .5);
        }
        d.y += d.v * dt; d.x += Math.sin(t * d.sw + d.p) * 22 * dt;
        d.rot += dt * d.sw * .8;
        if (d.y > R.y + R.h) { d.y = R.y - 10; d.x = R.x + rand(R.w); }
        ctx.save(); ctx.translate(d.x, d.y); ctx.rotate(d.rot);
        ctx.fillStyle = `rgba(${L.c || '212,178,96'},${(L.o || .5) * (.6 + .4 * Math.sin(d.rot))})`;
        ctx.beginPath();
        ctx.ellipse(0, 0, d.r, d.r * .42, 0, 0, TAU); ctx.fill();
        ctx.restore();
      }
      break;
    }

    case 'glint': {         // 水面 / 玻璃上的細碎反光
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      for (let i = 0; i < (L.n || 14); i++) {
        const k = i / (L.n || 14);
        const y = R.y + k * R.h;
        const off = Math.sin(t * (.4 + k * .8) * spd + i * 1.3) * R.w * (.04 + k * .1);
        ctx.strokeStyle = `rgba(${L.c || '255,255,255'},${(L.o || .05) * (.4 + k)})`;
        ctx.lineWidth = 1 + k * 2.4; ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(R.x + off, y); ctx.lineTo(R.x + R.w * (.2 + k * .5) + off, y);
        ctx.stroke();
      }
      ctx.restore();
      break;
    }
  }
}

/* ------------------- 把離屏畫布貼到有透視的四邊形上 -------------------
   拆成兩個三角形做仿射貼圖，看板即使不是正對鏡頭也能貼得服貼。 */
function triImage(img, s0, s1, s2, d0, d1, d2) {
  const den = s0.x * (s2.y - s1.y) - s1.x * s2.y + s2.x * s1.y + (s1.x - s2.x) * s0.y;
  if (!den) return;
  const m11 = -(s0.y * (d2.x - d1.x) - s1.y * d2.x + s2.y * d1.x + (s1.y - s2.y) * d0.x) / den;
  const m12 =  (s1.y * d2.y + s0.y * (d1.y - d2.y) - s2.y * d1.y + (s2.y - s1.y) * d0.y) / den;
  const m21 =  (s0.x * (d2.x - d1.x) - s1.x * d2.x + s2.x * d1.x + (s1.x - s2.x) * d0.x) / den;
  const m22 = -(s1.x * d2.y + s0.x * (d1.y - d2.y) - s2.x * d1.y + (s2.x - s1.x) * d0.y) / den;
  const dx =  (s0.x * (s2.y * d1.x - s1.y * d2.x) + s0.y * (s1.x * d2.x - s2.x * d1.x)
             + (s2.x * s1.y - s1.x * s2.y) * d0.x) / den;
  const dy =  (s0.x * (s2.y * d1.y - s1.y * d2.y) + s0.y * (s1.x * d2.y - s2.x * d1.y)
             + (s2.x * s1.y - s1.x * s2.y) * d0.y) / den;
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(d0.x, d0.y); ctx.lineTo(d1.x, d1.y); ctx.lineTo(d2.x, d2.y); ctx.closePath();
  ctx.clip();
  ctx.transform(m11, m12, m21, m22, dx, dy);
  ctx.drawImage(img, 0, 0);
  ctx.restore();
}
// 弧形看板：把畫布切成幾條，每條各自貼到曲線上，貼合圓筒狀的螢幕
function blitCurved(img, u0, u1, topFn, botFn, T, segs = 10) {
  const w = img.width, h = img.height;
  for (let i = 0; i < segs; i++) {
    const ka = i / segs, kb = (i + 1) / segs;
    const ua = u0 + (u1 - u0) * ka, ub = u0 + (u1 - u0) * kb;
    const P = [
      { x: T.sx + ua * T.sw, y: T.sy + topFn(ua) * T.sh },
      { x: T.sx + ub * T.sw, y: T.sy + topFn(ub) * T.sh },
      { x: T.sx + ub * T.sw, y: T.sy + botFn(ub) * T.sh },
      { x: T.sx + ua * T.sw, y: T.sy + botFn(ua) * T.sh }
    ];
    const sa = w * ka, sb = w * kb;
    const S = [{ x: sa, y: 0 }, { x: sb, y: 0 }, { x: sb, y: h }, { x: sa, y: h }];
    triImage(img, S[0], S[1], S[2], P[0], P[1], P[2]);
    triImage(img, S[0], S[2], S[3], P[0], P[2], P[3]);
  }
}

// quad = 圖片相對座標的四個角（左上、右上、右下、左下）
function blitQuad(img, quad, T) {
  const P = quad.map(q => ({ x: T.sx + q[0] * T.sw, y: T.sy + q[1] * T.sh }));
  const w = img.width, h = img.height;
  const s = [{ x: 0, y: 0 }, { x: w, y: 0 }, { x: w, y: h }, { x: 0, y: h }];
  triImage(img, s[0], s[1], s[2], P[0], P[1], P[2]);
  triImage(img, s[0], s[2], s[3], P[0], P[2], P[3]);
}
// 建立（或沿用）一塊離屏畫布
function panel(sc, key, w, h) {
  sc._panels = sc._panels || {};
  let c = sc._panels[key];
  if (!c || c.width !== w || c.height !== h) {
    c = document.createElement('canvas'); c.width = w; c.height = h;
    sc._panels[key] = c;
  }
  return c;
}

/* --------------------------- 色調與暗角 --------------------------- */
function drawGrade(sc, t) {
  const g = sc.grade || {};
  if (g.tint) {
    ctx.save();
    ctx.globalCompositeOperation = g.tintMode || 'soft-light';
    ctx.fillStyle = `rgba(${g.tint},${g.tintA == null ? .18 : g.tintA})`;
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }
  if (g.warm) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const lg = ctx.createLinearGradient(0, 0, 0, H);
    lg.addColorStop(0, `rgba(255,196,130,${g.warm})`);
    lg.addColorStop(1, `rgba(255,180,110,0)`);
    ctx.fillStyle = lg; ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }
  const v = g.vignette || [.34, '0,0,0'];
  const rg = ctx.createRadialGradient(W * .5, H * .48, Math.min(W, H) * .34,
                                      W * .5, H * .48, Math.max(W, H) * .82);
  rg.addColorStop(0, `rgba(${v[1]},0)`);
  rg.addColorStop(1, `rgba(${v[1]},${v[0]})`);
  ctx.fillStyle = rg; ctx.fillRect(0, 0, W, H);
  grain(g.grain == null ? .035 : g.grain);
}

/* ------------------------ 一個場景畫一幀 ------------------------ */
let sceneImg = null;
function renderScene(sc, t, dt) {
  loadScene(sc);
  sceneImg = sc._img;
  const T = drawBackdrop(sc, t, dt);
  // 水面位移要先做，否則會把後面畫的光暈擦掉
  if (sc.layers) for (const L of sc.layers) if (L.type === 'water') drawLayer(L, T, t, dt);
  if (T) drawBreathe(sc, T, t);
  if (sc.overlay) sc.overlay(T, t, dt);          // 場景自己的額外繪製（例如台股看板）
  drawBeams(sc, T, t);
  drawHotspots(sc, T, t);
  if (sc.layers) for (const L of sc.layers) if (L.type !== 'water') drawLayer(L, T, t, dt);
  drawGrade(sc, t);
}

      x.font = `700 ${Math.round(cw * .075)}px "PingFang TC","Noto Sans TC",system-ui,sans-serif`;
      x.fillText(title, 18, y); y += cw * .095;
    }
    // 前兩欄靠左、後三欄靠右；左看板貼在畫面邊緣，所以內容從 7% 起算才不會被裁掉
    const cols = [.06, .225, .580, .795, .995];   // 代碼 / 股名 / 最新價 / 漲跌 / 漲跌幅
    const fs = Math.round(cw * .048);
    x.font = `600 ${fs}px "PingFang TC","Noto Sans TC",system-ui,sans-serif`;
    x.fillStyle = 'rgba(168,206,246,.85)';
    ['代碼', '股名', '最新價', '漲跌', '漲跌幅'].forEach((h, i) => {
      x.textAlign = i >= 2 ? 'right' : 'left';
      x.fillText(h, cw * cols[i], y);
    });
    y += fs * 1.5;
    x.strokeStyle = 'rgba(140,190,240,.3)'; x.lineWidth = 1.5;
    x.beginPath(); x.moveTo(cw * .03, y - fs * .35); x.lineTo(cw * .97, y - fs * .35); x.stroke();

    const rowH = (ch - y - 14) / rows.length;
    const rf = Math.round(Math.min(rowH * .56, cw * .052));
    const nameMax = cw * (cols[2] - cols[1]) - cw * .17;   // 股名可用的寬度
    rows.forEach((s, i) => {
      const ry = y + i * rowH + (rowH - rf) / 2;
      const u2 = s.pct >= 0, col = u2 ? UP : DN;
      if (s.flash > .02) {
        x.fillStyle = u2 ? `rgba(255,81,71,${s.flash * .18})` : `rgba(34,201,138,${s.flash * .18})`;
        x.fillRect(cw * .02, y + i * rowH, cw * .96, rowH - 2);
      }
      x.textAlign = 'left';
      x.font = `600 ${rf}px ui-monospace,Menlo,monospace`;
      x.fillStyle = '#e8f2ff'; x.fillText(s.code, cw * cols[0], ry);
      // 名字太長就縮字，不讓它壓到價格
      let nf = rf;
      x.font = `600 ${nf}px "PingFang TC","Noto Sans TC",system-ui,sans-serif`;
      while (x.measureText(s.name).width > nameMax && nf > rf * .62) {
        nf -= 1; x.font = `600 ${nf}px "PingFang TC","Noto Sans TC",system-ui,sans-serif`;
      }
      x.fillText(s.name, cw * cols[1], ry + (rf - nf) * .55);
      x.textAlign = 'right';
      x.font = `600 ${rf}px ui-monospace,Menlo,monospace`;
      x.fillStyle = col;
      x.fillText(fmt(s.price), cw * cols[2], ry);
      x.fillText(`${u2 ? '▲' : '▼'}${Math.abs(s.base * s.pct / 100).toFixed(2)}`, cw * cols[3], ry);
      x.fillText(`${u2 ? '+' : ''}${s.pct.toFixed(2)}%`, cw * cols[4], ry);
    });
    x.textBaseline = 'alphabetic'; x.textAlign = 'left';
    x.globalAlpha = .12; x.fillStyle = '#000';
    for (let yy = 0; yy < ch; yy += 4) x.fillRect(0, yy, cw, 1.4);
    x.globalAlpha = 1;

    blitQuad(c, quad, T);
  },

  audio(A, bus) {

/* --- 場景切換 --- */
let idx = -1, switching = false;
function go(i, instant) {
  if (switching || i === idx) return;
  const target = scenes[i];
  loadScene(target);
  const apply = () => {
    idx = i; current = target;
    current._fade = 0;
    descEl.textContent = current.desc;
    chips.forEach((c, k) => c.classList.toggle('active', k === i));
    document.title = current.desc.split(' · ')[0] + ' · Calm Canvas';
    Audio_.switchTo(current);
    try { localStorage.setItem('calm.scene', current.id); } catch (e) {}
  };
  if (instant) { apply(); return; }
  switching = true;
  veil.classList.add('on');
  setTimeout(() => { apply(); veil.classList.remove('on'); switching = false; }, 460);
}

/* --- 視差輸入：滑鼠 / 觸控 / 手機傾斜 --- */
addEventListener('pointermove', e => {
  pointer.tx = clamp(e.clientX / W, 0, 1);
  pointer.ty = clamp(e.clientY / H, 0, 1);
}, { passive: true });
addEventListener('pointerleave', () => { pointer.tx = .5; pointer.ty = .5; }, { passive: true });
function enableTilt() {
  addEventListener('deviceorientation', e => {
    if (e.gamma == null) return;
    pointer.tx = clamp(.5 + e.gamma / 60, 0, 1);
    pointer.ty = clamp(.5 + (e.beta - 45) / 70, 0, 1);
  }, { passive: true });
}
if (typeof DeviceOrientationEvent !== 'undefined') {
  if (typeof DeviceOrientationEvent.requestPermission === 'function') {
    // iOS 需要使用者手勢後才可要求權限
    addEventListener('pointerdown', function once() {
      removeEventListener('pointerdown', once);
      DeviceOrientationEvent.requestPermission().then(r => { if (r === 'granted') enableTilt(); }).catch(() => {});
    }, { once: true });
  } else enableTilt();
}

/* --- 鍵盤 --- */
addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.target && e.target.tagName === 'INPUT' && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) return;
  const k = e.key.toLowerCase();
  if (k >= '1' && k <= String(Math.min(9, scenes.length))) { go(+k - 1); wake(); return; }
  if (k === 'm') { soundBtn.click(); wake(); }
  else if (k === 'h') { document.body.classList.toggle('zen'); }
  else if (k === 'f') { fullBtn.click(); }
  else if (k === 'arrowright') { go((idx + 1) % scenes.length); wake(); }
  else if (k === 'arrowleft') { go((idx - 1 + scenes.length) % scenes.length); wake(); }
});

/* --- 閒置自動隱藏介面 --- */
let idleTimer = null;
function wake() {
  document.body.classList.remove('zen');
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => document.body.classList.add('zen'), 9000);
}
['mousemove', 'pointerdown', 'touchstart', 'wheel'].forEach(ev =>
  addEventListener(ev, wake, { passive: true }));

/* --- 分頁隱藏時完全停止（省電） --- */
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    running = false;
    if (Audio_.ctx && Audio_.ctx.state === 'running') Audio_.ctx.suspend();
  } else {
    running = true; last = performance.now() / 1000;
    if (Audio_.on && Audio_.ctx) Audio_.ctx.resume();
    requestAnimationFrame(frame);
  }
});

/* --- 視窗尺寸改變 --- */
let rzTimer = null;
addEventListener('resize', () => {
  clearTimeout(rzTimer);
  rzTimer = setTimeout(() => {
    sizeCanvas();
    for (const s of scenes) { if (s.layers) for (const L of s.layers) L._p = null; }
  }, 140);
}, { passive: true });

/* --- 主迴圈 --- */
function frame(now) {
  if (!running) return;
  now /= 1000;
  let dt = now - last; last = now;
  dt = Math.min(dt, .05);
  tSec += dt;
  if (current) {
    try { renderScene(current, tSec, dt); }
    catch (err) {
      console.error(err);
      ctx.fillStyle = '#0d0f13'; ctx.fillRect(0, 0, W, H);
    }
  }
  requestAnimationFrame(frame);
}

/* --- 啟動 --- */
sizeCanvas();
let start = 0;
try {
  const saved = localStorage.getItem('calm.scene');
  const k = scenes.findIndex(s => s.id === saved);
  if (k >= 0) start = k;
} catch (e) {}
scenes.forEach(loadScene);          // 六張圖一起預載，切換才不會等
go(start, true);
wake();
setTimeout(() => hintEl.classList.add('hide'), 9000);
requestAnimationFrame(frame);
</script>
</body>
</html>
